[package]
name = "ursula"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ursula"
path = "src/main.rs"

[dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
hound = "3.5"
ctrlc = "3.5"

[profile.release]
lto = "thin"
